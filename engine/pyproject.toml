[project]
name = "docfactory-engine"
version = "0.1.0"
description = "DocFactory 离线文档解析引擎（Electron sidecar）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }

# 许可证红线（03 章 §6）：仅允许 MIT / BSD / Apache-2.0 / MPL-2.0(进程隔离)
# 禁止引入：PyMuPDF(fitz)、MinerU、doclayout_yolo、ultralytics、camelot
dependencies = [
    "fastapi>=0.115",           # MIT
    "uvicorn[standard]>=0.34",  # BSD-3
    "sse-starlette>=2.1",       # BSD-3
    "pydantic>=2.9",            # MIT
    "loguru>=0.7",              # MIT
    "python-docx>=1.1",         # MIT
    "python-pptx>=1.0",         # MIT
    "openpyxl>=3.1",            # MIT
    "pdfplumber>=0.11",         # MIT
    "pypdfium2>=4.30",          # BSD-3 / Apache-2.0
    "cryptography>=43",         # Apache-2.0 / BSD-3（.kmod Ed25519 验签）
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pip-licenses>=5",
    "reportlab>=4",             # BSD-3（仅测试：程序化生成 PDF fixture，不进发布包）
]

[project.scripts]
docfactory-engine = "docfactory.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfactory"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
