[project]
name = "docfactory-engine"
version = "0.1.0"
description = "DocFactory 离线文档解析引擎（Electron sidecar）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }

# 许可证红线（03 章 §6）：仅允许 MIT / BSD / Apache-2.0 / MPL-2.0(进程隔离)
# 禁止引入：PyMuPDF(fitz)、MinerU、doclayout_yolo、ultralytics、camelot
#
# 版本口径（08 章 §6，2026-07-29 M1 打包实测后锁定）：小版本区间 + uv.lock 冻结精确值。
# 上界不是洁癖——它挡住「重新 lock 时静默跨小版本」，升级必须显式改这里并重跑全量门禁。
dependencies = [
    "fastapi>=0.140,<0.141",        # MIT
    "uvicorn[standard]>=0.51,<0.52",  # BSD-3
    "sse-starlette>=3.4,<3.5",      # BSD-3
    "pydantic>=2.13,<3",            # MIT
    "loguru>=0.7,<0.8",             # MIT
    "python-docx>=1.2,<2",          # MIT
    "python-pptx>=1.0,<1.1",        # MIT
    "openpyxl>=3.1,<3.2",           # MIT
    "pdfplumber>=0.11,<0.12",       # MIT
    "pypdfium2>=5.12,<6",           # BSD-3 / Apache-2.0
    "cryptography>=49,<50",         # Apache-2.0 / BSD-3（.kmod Ed25519 验签）
    "xlrd>=2.0.1,<3",               # BSD-3（.xls 离线兜底：无 LibreOffice 时的备选解析路径）
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "pip-licenses>=5",
    "reportlab>=4",             # BSD-3（仅测试：程序化生成 PDF fixture，不进发布包）
    # 出包链路（08 章 §2）：仅构建期使用，不进运行时依赖，因此不参与许可证红线口径
    "pyinstaller>=6.21",
    "pyinstaller-hooks-contrib>=2024.10",
    "xlwt>=1.3",                # BSD（仅测试/corpus：程序化生成 .xls fixture，不进发布包）
]

[project.scripts]
docfactory-engine = "docfactory.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfactory"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
